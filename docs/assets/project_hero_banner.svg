<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #38bdf8; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #64748b; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Decorative Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Glowing background circles -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)"/>
  <circle cx="1050" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- Top Pill: Academic Context -->
  <g transform="translate(420, 28)">
    <rect width="360" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981"/>
    <text x="28" y="19" class="tag-text">AL-RAZI UNIVERSITY • BIG DATA COURSE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="115" text-anchor="middle" class="title">Enterprise Big Data Hybrid ELT Pipeline</text>

  <!-- Subtitle -->
  <text x="600" y="152" text-anchor="middle" class="subtitle">Distributed Ingestion • Quality Assurance • Materialized Views • Unified REST API</text>

  <!-- Technology Badges Row -->
  <g transform="translate(190, 185)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="6" fill="#3b82f6"/>
      <text x="32" y="22" class="badge-text">Python 3.11+</text>
    </g>
    <!-- Apache Spark -->
    <g transform="translate(148, 0)">
      <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="6" fill="#ea580c"/>
      <text x="32" y="22" class="badge-text">Apache Spark 3.5</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(320, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="6" fill="#10b981"/>
      <text x="32" y="22" class="badge-text">MongoDB 6.0</text>
    </g>
    <!-- FastAPI -->
    <g transform="translate(477, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="6" fill="#06b6d4"/>
      <text x="32" y="22" class="badge-text">FastAPI REST</text>
    </g>
    <!-- APScheduler -->
    <g transform="translate(619, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="6" fill="#a855f7"/>
      <text x="32" y="22" class="badge-text">APScheduler Jobs</text>
    </g>
  </g>

  <!-- Bottom Details: Guarantees & Volume -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text class="meta-text">
      <tspan fill="#38bdf8" font-weight="600">30,000,000+ Records Tested</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#10b981" font-weight="600">Zero Data Loss</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#c084fc" font-weight="600">Guaranteed Idempotency</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#f59e0b" font-weight="600">49/49 Unit Tests Passing (100%)</tspan>
    </text>
  </g>
</svg>
