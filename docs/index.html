<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Data Hybrid Pipeline Unified API — Interactive OpenAPI Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <link rel="icon" type="image/png" href="https://fastapi.tiangolo.com/img/favicon.png">
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar {
      display: none !important;
    }
    .custom-header {
      background: #0b0f19;
      color: #fff;
      padding: 1.25rem 2rem;
      border-bottom: 3px solid #3b82f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .custom-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #60a5fa;
    }
    .custom-header p {
      margin: 0.25rem 0 0 0;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .custom-header a {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .custom-header a:hover {
      opacity: 0.9;
    }
    .swagger-ui .info {
      margin: 25px 0;
    }
  </style>
</head>
<body>
  <div class="custom-header">
    <div>
      <h1>⚡ Big Data Hybrid Pipeline Unified API (OpenAPI 3.1)</h1>
      <p>Al-Razi University | Faculty of Computing & Artificial Intelligence | Author: <b>Mushtaq Alfaqih</b> | Supervised by: <b>Eng. Omar Abusand</b></p>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
      <a href="./dashboard.html" style="background: linear-gradient(135deg, #10b981, #059669);">📊 Live Analytics Dashboard</a>
      <a href="https://github.com/mushtaqalfaqih/BigData-Midterm-Pipeline" target="_blank">📂 View Repository on GitHub</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      fetch('./openapi.json')
        .then(response => response.json())
        .then(spec => {
          const ui = SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout"
          });
          window.ui = ui;
        })
        .catch(err => {
          console.error("Failed to load openapi.json:", err);
        });
    };
  </script>
</body>
</html>
